<!-- templates/login.html -->
{% extends "base.html" %}

{% block title %}ログイン｜OTALOG{% endblock %}

{# ログイン画面では共通ヘッダーとページタイトルバナーを非表示にする #}
{% block header %}{% endblock %}
{% block page_header %}{% endblock %}

{% block content %}
    <div class="auth-container" style="margin-left: auto; margin-right: auto;">
        <h1>🔑 ログイン</h1>

        <form action="{{ url_for('login') }}" method="POST">
            <div class="form-group">
                <label for="username">ユーザー名</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div class="form-actions" style="margin-top: 20px;">
                <button type="submit" class="submit-btn" style="width: 100%;">ログイン</button>
            </div>
        </form>
        <p class="auth-link-text">
            <a href="{{ url_for('register') }}">新規登録はこちら</a>
        </p>
    </div>
{% endblock %}
