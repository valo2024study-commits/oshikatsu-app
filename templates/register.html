<!-- templates/register.html -->
{% extends "base.html" %}

{% block title %}新規アカウント作成｜推し活記録アプリ{% endblock %}
{% block header %}{% endblock %}
{% block page_header %}{% endblock %}

{% block content %}
    <div class="auth-container" style="margin-left: auto; margin-right: auto;">
        <h1>👤 アカウント登録</h1>

        <form action="{{ url_for('register') }}" method="POST">
            <div class="form-group">
                <label for="username">ユーザー名（ID）</label>
                <input type="text" id="username" name="username" class="form-control" required>
            </div>
            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div class="form-actions" style="margin-top: 20px;">
                <button type="submit" class="submit-btn" style="width: 100%;">登録してはじめる</button>
            </div>
        </form>
        <p class="auth-link-text">
            <a href="{{ url_for('login') }}">登録済みの方はこちら（ログイン）</a>
        </p>
    </div>
{% endblock %}
